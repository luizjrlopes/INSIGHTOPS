services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightops}
      POSTGRES_USER: ${POSTGRES_USER:-insightops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightops}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightops} -d ${POSTGRES_DB:-insightops}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]
    volumes: ["insightops-db:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://insightops:insightops@db:5432/insightops}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  insightops-db:
